<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Abstract car with speed lines and a fuel gauge">
  <!-- original illustration: generic hatchback silhouette, speed lines and a gauge (no real brand) -->
  <defs>
    <linearGradient id="mlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#80031F"/>
      <stop offset="0.55" stop-color="#DF3511"/>
      <stop offset="1" stop-color="#F26A10"/>
    </linearGradient>
    <linearGradient id="mlfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F26A10" stop-opacity="0"/>
      <stop offset="1" stop-color="#F26A10" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="mlglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#80031F" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#80031F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="350" cy="170" rx="300" ry="120" fill="url(#mlglow)"/>
  <!-- speed lines -->
  <g stroke="url(#mlfade)" stroke-width="4" stroke-linecap="round">
    <path d="M20 140H150"/>
    <path d="M60 172H170"/>
    <path d="M10 204H160"/>
    <path d="M90 236H180"/>
  </g>
  <!-- road -->
  <path d="M150 262H620" stroke="#2A2A31" stroke-width="3" stroke-linecap="round"/>
  <path d="M190 262h40M270 262h40M350 262h40M430 262h40M510 262h40" stroke="#3A3A44" stroke-width="3" stroke-linecap="round"/>
  <!-- body -->
  <path d="M170 228c0-22 10-36 32-42l52-14 54-46c12-10 26-16 42-16h96c22 0 38 8 52 24l40 42 30 8c18 5 30 18 30 36v8c0 8-6 14-14 14H184c-8 0-14-6-14-14z"
        fill="#141417" stroke="url(#mlg)" stroke-width="5" stroke-linejoin="round"/>
  <!-- windows -->
  <path d="M276 172l40-34c8-7 18-10 28-10h40v44z" fill="#1B1B20" stroke="#2A2A31" stroke-width="2"/>
  <path d="M398 128h14c16 0 28 6 38 18l22 26h-74z" fill="#1B1B20" stroke="#2A2A31" stroke-width="2"/>
  <path d="M206 204h330" stroke="#2A2A31" stroke-width="2"/>
  <!-- lights -->
  <path d="M556 206h22" stroke="#F26A10" stroke-width="6" stroke-linecap="round"/>
  <path d="M182 206h14" stroke="#DF3511" stroke-width="6" stroke-linecap="round"/>
  <!-- wheels -->
  <g stroke="url(#mlg)" stroke-width="5" fill="#0B0B0D">
    <circle cx="252" cy="242" r="30"/>
    <circle cx="500" cy="242" r="30"/>
  </g>
  <g fill="#2A2A31">
    <circle cx="252" cy="242" r="10"/>
    <circle cx="500" cy="242" r="10"/>
  </g>
  <!-- gauge -->
  <g transform="translate(560 70)">
    <path d="M-46 14a46 46 0 0 1 92 0" fill="none" stroke="#2A2A31" stroke-width="8" stroke-linecap="round"/>
    <path d="M-46 14a46 46 0 0 1 70 -39" fill="none" stroke="url(#mlg)" stroke-width="8" stroke-linecap="round"/>
    <path d="M0 14L22 -16" stroke="#F4F4F5" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="14" r="6" fill="#F4F4F5"/>
  </g>
</svg>
