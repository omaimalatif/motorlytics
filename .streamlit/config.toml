# Motorlytics theme: white, sky blue and black with a dark sidebar and an orange accent, whatever the OS setting.
# Colours, fonts and the CSS that goes beyond these options live in ui/theme.py (single source of truth;
# keep the values below in sync with it).

[server]
enableWebsocketCompression = true   # smaller messages: faster on slow mobile connections

[client]
toolbarMode = "minimal"          # no Deploy button or main menu
# the page files live in app_pages/ (not pages/), so Streamlit never shows its automatic page list on start

[theme]
base = "light"
primaryColor = "#EA580C"          # orange: toggles, progress bars, sparklines, focus
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F9FC"
textColor = "#0B1220"
borderColor = "#E3EAF0"
showWidgetBorder = true
baseRadius = "8px"
buttonRadius = "8px"
linkColor = "#14689E"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap, sans-serif"
metricValueFontWeight = 700
dataframeBorderColor = "#E3EAF0"
dataframeHeaderBackgroundColor = "#F5F9FC"
# badge / status colours (readable on white): success, warning, error, info, gray; yellow = the "normal" driving style
greenColor = "#15803D"
orangeColor = "#B45309"
redColor = "#D92D20"
yellowColor = "#A16207"
blueColor = "#14689E"
violetColor = "#6D28D9"
grayColor = "#5B6B7F"
chartCategoricalColors = ["#0369A1", "#0B1220", "#C2410C"]

[theme.sidebar]                  # dark sidebar for contrast
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#1E293B"
borderColor = "#334155"
textColor = "#E2E8F0"
primaryColor = "#EA580C"
# badge colours readable on the dark sidebar
greenColor = "#4ADE80"
blueColor = "#7DD3FC"
orangeColor = "#FDBA74"
redColor = "#F87171"
yellowColor = "#FCD34D"
grayColor = "#CBD5E1"
